<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D5A37">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>하이킥 팀 밸런서</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 잔디색 헤더 밴드 + 하단 탭 3개(팀 짜기/회원/기록), 팀은 1~6번 번호로 구분(색은 보조 표시) */
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --sunk:#E3E9E3; --ink:#14211A; --muted:#5B6B61; --line:#D3DCD4;
  --pitch:#1D5A37; --pitch-ink:#F3F7F1; --accent:#1D7A48; --accent-soft:#D7EBDD;
  --good:#1D7A48; --warn:#B8741A; --bad:#B83A2E;
  --bib1:#F2762E; --bib2:#E3BC14; --bib3:#2F7FE0; --bib4:#E04F8E; --bib5:#6FB33A; --bib6:#8A5CD6;
  --tS:#E8770E; --tA:#8E44C9; --tB:#2F7FE0; --tC:#23A35A; --tD:#8C9893;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1511; --surface:#15201A; --sunk:#1B2820; --ink:#E5EDE7; --muted:#93A39A; --line:#283730;
  --pitch:#123A24; --pitch-ink:#E8F2EA; --accent:#4FBF7E; --accent-soft:#1E3A2A;
  --good:#4FBF7E; --warn:#E0A24A; --bad:#E86B5F;
  --tS:#F59A3C; --tA:#B77CE8; --tB:#5FA2F2; --tC:#4CC77F; --tD:#8A9690; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1511; --surface:#15201A; --sunk:#1B2820; --ink:#E5EDE7; --muted:#93A39A; --line:#283730;
  --pitch:#123A24; --pitch-ink:#E8F2EA; --accent:#4FBF7E; --accent-soft:#1E3A2A;
  --good:#4FBF7E; --warn:#E0A24A; --bad:#E86B5F;
  --tS:#F59A3C; --tA:#B77CE8; --tB:#5FA2F2; --tC:#4CC77F; --tD:#8A9690; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* header band with chalk markings */
.band{background:var(--pitch);color:var(--pitch-ink);position:relative;overflow:hidden}
.band::before{content:"";position:absolute;right:-60px;top:50%;width:180px;height:180px;border:2px solid rgba(255,255,255,.16);border-radius:50%;transform:translateY(-50%)}
.band::after{content:"";position:absolute;right:28px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.16)}
.band .wrap{padding-block:20px 18px;position:relative}
.who{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:var(--pitch-ink);border-radius:999px;padding:6px 12px;font-size:.8rem;white-space:nowrap;position:relative;z-index:1}
.band h1{font-family:var(--f-display);font-weight:400;font-size:1.75rem;line-height:1.1;margin:0;letter-spacing:.01em}
.band p{margin:.35rem 0 0;font-size:.85rem;opacity:.8}
.stats{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--f-num);font-size:1.25rem;font-weight:500}
.stats span{font-size:.72rem;opacity:.75;letter-spacing:.04em}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{background:none;border:0;padding:10px 4px 12px;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}

section.view{padding-block:18px 24px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-display);font-weight:400;font-size:1.2rem;margin:0;text-wrap:balance}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.label{font-size:.72rem;letter-spacing:.06em;color:var(--muted);font-weight:700}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-size:.88rem;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.big{padding:13px 18px;font-size:1rem;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px}

/* attendance chips */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.chip{display:flex;align-items:center;gap:6px;padding:8px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left;min-width:0}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip[aria-pressed="true"] .nm{font-weight:700}
.tier{display:inline-grid;place-items:center;min-width:26px;height:20px;padding:0 4px;border-radius:5px;font-family:var(--f-num);font-size:.72rem;font-weight:500;color:#fff;flex:none}
.tier.G{background:transparent;color:var(--muted);border:1px dashed var(--muted);min-width:34px}
.chip.guest{border-style:dashed;background:var(--sunk)}
.gx{border:0;background:none;color:var(--muted);padding:0 2px;flex:none}
.t-S{--tc:var(--tS)}.t-A{--tc:var(--tA)}.t-B{--tc:var(--tB)}.t-C{--tc:var(--tC)}.t-D{--tc:var(--tD)}
.tint{box-shadow:inset 4px 0 0 var(--tc);background:color-mix(in srgb,var(--tc) 10%,var(--surface))}
.stripe{box-shadow:inset 4px 0 0 var(--tc)}
.tb{display:inline-flex;flex:none;line-height:0;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.ft{display:inline-block;font:700 .62rem/1 var(--f-num);padding:2px 4px;border-radius:4px;background:var(--sunk);color:var(--muted);vertical-align:2px}
.ft.tall{background:#E3EEF9;color:#1F5C99}.ft.lf{background:#FCEBDD;color:#A4511B}
.tier.S{background:var(--tS)}.tier.A{background:var(--tA)}.tier.B{background:var(--tB)}.tier.C{background:var(--tC)}.tier.D{background:var(--tD)}

.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 11px;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* team cards */
.opts{display:flex;gap:6px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.team header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.bib{width:14px;height:18px;border-radius:3px 3px 5px 5px;flex:none}
.team header .t{font-weight:700}
.team header .avg{margin-left:auto;font-family:var(--f-num);font-size:.95rem}
.team .meta{display:flex;gap:6px;padding:8px 12px 2px;flex-wrap:wrap}
.pill{font-size:.72rem;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.ok{color:var(--good)}
.pill.no{color:var(--bad)}
.team ul{list-style:none;margin:0;padding:6px 6px 8px;display:flex;flex-direction:column;gap:3px}
.team li button{width:100%;display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:8px;padding:5px 6px;text-align:left}
.team li button .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team li button .pos{font-size:.72rem;color:var(--muted)}
.team li button .sc{font-family:var(--f-num);font-size:.8rem;color:var(--muted);width:30px;text-align:right}
.team li button.sel{border-color:var(--accent);background:var(--accent-soft)}
.balance{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--sunk)}
.balance b{font-family:var(--f-num);font-size:1.1rem;font-weight:500}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

/* member list */
.dist{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.dist span{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.mlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mlist li+li{border-top:1px solid var(--line)}
.mlist button{width:100%;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:10px 12px;background:none;border:0;text-align:left}
.mlist .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.mlist .sub{font-size:.75rem;color:var(--muted);display:block}
.mlist .eff{font-family:var(--f-num);font-size:.95rem;text-align:right}
.adj{font-family:var(--f-num);font-size:.75rem;min-width:44px;text-align:right}
.up{color:var(--good)}.down{color:var(--bad)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:90%;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field input[type=text],.field textarea,select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
.field textarea{min-height:160px;font-family:var(--f-num);font-size:.85rem;line-height:1.6}
.scores{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.scores button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 0;font-family:var(--f-num);font-size:.82rem}
.scores button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.toggle{display:flex;align-items:center;gap:10px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}

/* records */
.match{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.match .tlist{display:flex;flex-direction:column;gap:4px;font-size:.82rem}
.match .tlist div{display:flex;gap:8px;align-items:baseline}
.match .tlist .names{color:var(--muted);min-width:0}
.games{display:flex;flex-direction:column;gap:4px}
.game{display:flex;align-items:center;gap:8px;font-size:.9rem;padding:6px 8px;border-radius:8px;background:var(--sunk)}
.game .num{font-size:1rem}
.game .x{margin-left:auto;background:none;border:0;color:var(--muted);padding:2px 6px}
.gform{display:grid;grid-template-columns:1fr 56px auto 56px 1fr;gap:6px;align-items:center}
.gform input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 4px;text-align:center;width:100%;font-family:var(--f-num)}
.gform select{padding:8px 6px}
.badge{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px}
.badge.done{background:var(--accent-soft);color:var(--good)}
.badge.wait{background:var(--sunk);color:var(--warn)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:40;max-width:calc(100% - 32px)}
.notice{font-size:.82rem;padding:10px 12px;border-radius:10px;background:var(--sunk);color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.chip,.team li button,.btn{transition:background .15s,border-color .15s}}
/* 주사위 */
.dice-ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(10,24,16,.55);backdrop-filter:blur(2px)}
.dice-box{display:flex;flex-direction:column;align-items:center;gap:18px;color:#F3F7F1;font-family:var(--f-display);font-size:1.3rem;letter-spacing:.02em}
.dice-row{display:flex;gap:22px}
.die{width:74px;height:74px;border-radius:16px;background:#FFFFFF;box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 -5px 0 rgba(0,0,0,.08);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:11px;gap:2px}
.die i{width:13px;height:13px;border-radius:50%;background:#1D5A37;place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.die.b i{background:#C0392B}
@keyframes tumble{0%{transform:translateY(-40px) rotate(0)}25%{transform:translateY(0) rotate(160deg)}45%{transform:translateY(-18px) rotate(250deg)}65%{transform:translateY(0) rotate(330deg)}82%{transform:translateY(-6px) rotate(352deg)}100%{transform:translateY(0) rotate(360deg)}}
.die.roll{animation:tumble 1.15s cubic-bezier(.3,.7,.4,1) both}
.die.b.roll{animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.teams.reveal .team{animation:rise .45s ease both}
.teams.reveal .team:nth-child(2){animation-delay:.08s}.teams.reveal .team:nth-child(3){animation-delay:.16s}.teams.reveal .team:nth-child(4){animation-delay:.24s}.teams.reveal .team:nth-child(5){animation-delay:.32s}.teams.reveal .team:nth-child(6){animation-delay:.4s}
/* 레이더 */
.radar{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.radar svg{width:100%;max-width:340px;height:auto;justify-self:center;overflow:visible}
.radar .lg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.radar .lg button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.8rem}
.radar .lg button[aria-pressed="false"]{opacity:.4}
.radar .lg i{width:10px;height:10px;border-radius:50%;display:inline-block}
</style>
</head>
<body>

<div class="band"><div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><h1>하이킥 팀 밸런서</h1><button class="who" id="whoBtn" hidden>운영진 로그인</button></div>
  <p>출석 체크하고 6인 팀을 고르게 나눕니다</p>
  <div class="stats">
    <div><b id="stMembers" class="num">–</b><span>등록 회원</span></div>
    <div><b id="stAttend" class="num">0</b><span id="stAttendLbl">출석</span></div>
    <div><b id="stTeams" class="num">–</b><span>예상 팀 수</span></div>
  </div>
</div></div>

<main class="wrap">
  <section class="view" id="v-make"></section>
  <section class="view" id="v-members" hidden></section>
  <section class="view" id="v-records" hidden></section>
</main>

<nav class="tabs" aria-label="메뉴"><div class="in" role="tablist">
  <button role="tab" data-tab="make" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/></svg>팀 짜기</button>
  <button role="tab" data-tab="members" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>회원 티어</button>
  <button role="tab" data-tab="records" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>경기 기록</button>
</div></nav>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<!-- Firebase (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js?v=1792456454"></script>
<script src="adapter.js?v=1792456454"></script>
<script>
(function(){
"use strict";
const POS={FW:"공격",DF:"수비"};
const BIBS=[["1팀","var(--bib1)"],["2팀","var(--bib2)"],["3팀","var(--bib3)"],["4팀","var(--bib4)"],["5팀","var(--bib5)"],["6팀","var(--bib6)"]];
const SCORES=[1,1.5,2,2.5,3,3.5,4,4.5,5];
const ADJ_CAP=1.5, STEP=0.1;

let db=null, ready=false;
let members=[], matches=[];
let attend=new Set();
let guests=[];
let pairW=new Map();
let pairs=[]; // 같은 팀으로 묶을 짝 [{a,b}] (상위-하위 멘토 묶기)
let logs=[];
let pubNext=null; // 회원 공개용 다음 경기 안내 (이름만, 점수 없음)
async function savePublic(teams,matchId){
  if(!db)return;
  const keep=teams!==undefined?teams:(pubNext&&pubNext.date===gameDate()?pubNext.teams:null);
  const mid=matchId!==undefined?matchId:(pubNext&&pubNext.date===gameDate()?pubNext.matchId||null:null);
  try{await db.doc("public/next").set({date:gameDate(),count:headcount(),teams:keep||null,matchId:mid,updatedAt:Date.now()});}catch(e){}
}   // 운영진 변경 기록 (최근 200건)
const me=()=>{try{return localStorage.getItem("hkName")||"";}catch(e){return "";}};
const setMe=v=>{try{localStorage.setItem("hkName",v);}catch(e){}};
const OPERATORS=["이진환","이상연","조경범","조윤규"];
async function addLog(o){if(!db)return;try{await db.collection("logs").add({at:Date.now(),by:me()||"이름 없음",...o});}catch(e){}}
const headcount=()=>attend.size+guests.length;
let teamCount=null;
let options=[], optIdx=0, selected=null;
let tab="make", memberSort="score", memberOrder=null, lastEdited=null;
let attendTimer=null;
let matchDate=null; // 다음 경기 날짜 (출석·조합·기록·이미지에 쓰임)
const gameDate=()=>matchDate||today();

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=x=>Math.round(x*100)/100;
const INJ=0.5;
const adjOf=m=>(m.adj||0)-(m.injured?INJ:0);
const eff=m=>r2((m.score||3)+adjOf(m));
const FOOT={L:"왼발",R:"오른발",B:"양발"};
const badges=m=>(m.injured?" 🩹":"")+(m.tall?' <span class="ft tall">장신</span>':"")+(m.foot==="L"?' <span class="ft lf">왼발</span>':m.foot==="B"?' <span class="ft">LR</span>':"");
function tierOf(s){const b=Math.max(1,Math.min(5,Math.floor(s)));const L={5:"S",4:"A",3:"B",2:"C",1:"D"}[b];return {k:L,label:L+(s%1>=.5&&b<5?"+":"")};}

// ---- 능력치 5가지 (1~5점): 슈터·드리블러·패스마스터·수비력·활동량 / 별도 표기: 장신·왼발 ----
const AREAS=[["sht","슈터"],["dri","드리블러"],["pas","패스마스터"],["def","수비력"],["sta","활동량"]];
const AREA_SHORT={sht:"슛",dri:"드",pas:"패",def:"수",sta:"활"};
const POS_WEIGHT={FW:{sht:.3,dri:.2,pas:.2,def:.1,sta:.2},DF:{sht:.05,dri:.1,pas:.2,def:.4,sta:.25}};
const half=x=>Math.round(x*2)/2;
const suggestPos=v=>Math.max(v.sht??3,v.dri??3)>=(v.def??3)?"FW":"DF";
function overallOf(v,pos){const w=POS_WEIGHT[pos]||POS_WEIGHT.FW;return r2(AREAS.reduce((a,[k])=>a+(v[k]??3)*w[k],0));}
// 예전 데이터 이행: 공격력 → 슈터, 기술(미드) → 드리블러·패스마스터 임시값(미입력 표시), 피지컬 → 장신 표기로 대체
function norm(m){
  const b=m.score||3,tec=m.tec??m.mid??b,legacy=half(((m.atk??b)+tec+(m.def??b))/3);
  const o={...m,sht:m.sht??m.atk??b,dri:m.dri??tec,pas:m.pas??tec,def:m.def??b,sta:m.sta??legacy,tall:!!m.tall,tallSet:m.tallSet??(m.tall!=null)};
  o.unset=Array.isArray(m.unset)?m.unset:[m.dri==null?"드리블러":"",m.pas==null?"패스마스터":"",m.sta==null?"활동량":""].filter(Boolean);
  o.pos=m.posSet&&(m.pos==="FW"||m.pos==="DF")?m.pos:suggestPos(o);
  o.score=overallOf(o,o.pos);
  return o;
}
// 용병: 능력치를 입력했으면(rated) 회원처럼 밸런스에 넣고, 모르면 무작위 배치

const gNorm=g=>g.rated?norm({...g,guest:true,adj:0}):{...g,guest:true};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const fmtDate=s=>{const [y,m,d]=s.split("-");const w="일월화수목금토"[new Date(+y,m-1,+d).getDay()];return `${+m}월 ${+d}일 (${w})`;};

/* ---------- team generation ---------- */
function sizes(n,k){const b=Math.floor(n/k),r=n%k;return Array.from({length:k},(_,i)=>b+(i<r?1:0));}
function defaultK(n){return Math.max(2,Math.round(n/6));}
function kChoices(n){const out=[];for(let k=2;k<=6;k++){const s=sizes(n,k);if(s[s.length-1]>=4&&s[0]<=8)out.push(k);}return out;}
function stats(all){
  const team=all.filter(m=>!m.guest||m.rated),n=team.length;
  const e=team.map(eff).sort((x,y)=>y-x),sum=e.reduce((a,x)=>a+x,0);
  const av=k=>n?team.reduce((a,m)=>a+m[k]+adjOf(m),0)/n:0;
  return {n:all.length,guest:all.length-n,sum:r2(sum),avg:n?sum/n:0,
    sht:av("sht"),dri:av("dri"),pas:av("pas"),def:av("def"),sta:av("sta"),
    tall:team.filter(m=>m.tall).length,
    spec:Object.fromEntries(AREAS.map(([k])=>[k,team.filter(m=>m[k]>=4).length])),
    top2:(e[0]||0)+(e[1]||0),bot2:n>=2?e[n-1]+e[n-2]:(e[0]||0),
    left:team.filter(m=>m.foot==="L").length,inj:team.filter(m=>m.injured).length,
    T:team.reduce((o,m)=>{o[tierOf(m.score).k]++;return o;},{S:0,A:0,B:0,C:0,D:0}),
    P:team.reduce((o,m)=>{o[m.pos==="DF"?"DF":"FW"]++;return o;},{FW:0,DF:0})};
}
const pk=(a,b)=>a<b?a+"|"+b:b+"|"+a;
function buildPairW(){
  // 최근 3번의 확정 조합에서 같은 팀이었던 회원 쌍 (최근일수록 가중치 큼)
  pairW=new Map();const W=[1,.6,.3];
  [...matches].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,3).forEach((mt,mi)=>{
    (mt.teams||[]).forEach(t=>{const ids=t.ids||[];for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const key=pk(ids[i],ids[j]);pairW.set(key,(pairW.get(key)||0)+W[mi]);}});
  });
}
function activePairs(){return pairs.filter(p=>attend.has(p.a)&&attend.has(p.b));}
function pairCost(teams){const ap=activePairs();if(!ap.length)return 0;const where=new Map();teams.forEach((t,i)=>t.forEach(m=>where.set(m.id,i)));
  let c=0;for(const p of ap)if(where.get(p.a)!==where.get(p.b))c++;return c*1000;}
function overlap(teams){let o=0;if(!pairW.size)return 0;
  for(const t of teams){const ids=t.filter(m=>!m.guest).map(m=>m.id);for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)o+=pairW.get(pk(ids[i],ids[j]))||0;}
  return o;}
function lastOverlap(teams){ // 직전 경기와 그대로 겹치는 쌍 수
  const last=[...matches].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];if(!last)return null;
  const set=new Set();(last.teams||[]).forEach(t=>{const ids=t.ids||[];for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)set.add(pk(ids[i],ids[j]));});
  let c=0;for(const t of teams){const ids=t.filter(m=>!m.guest).map(m=>m.id);for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)if(set.has(pk(ids[i],ids[j])))c++;}
  return c;}

/*
 * 팀 조합 엔진
 * ① 필수 조건: 팀 인원(정해진 크기), 같은 팀 묶기 짝, 팀마다 수비수 1명 이상 → 어기면 아주 큰 벌점
 * ② 맞출 지표(중요한 순): 팀 전력 평균 > 에이스(상위 2명) > 약점(하위 2명) > 능력치 5가지 평균
 *    > 주특기 선수(항목 4점 이상) 분산 > 공격·수비 인원 > 티어 분포 > 장신·왼발 분산 > 지난 조합 겹침
 *    각 지표는 오늘 참석자들의 실력 편차로 나눠 같은 기준(정규화)으로 비교하고,
 *    최대-최소가 아니라 "모든 팀이 전체 평균에서 벗어난 정도(제곱 평균)"로 계산
 * ③ 탐색: 여러 시작 조합 → 1:1 교환(가장 좋은 것) → 막히면 2:2 교환 → 반복
 */
let CTX={sd:.6,sk:{sht:.6,dri:.6,pas:.6,def:.6,sta:.6}};
const sdOf=a=>{if(!a.length)return .6;const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.max(.35,Math.sqrt(a.reduce((x,y)=>x+(y-m)*(y-m),0)/a.length));};
function setCtx(players){CTX={sd:sdOf(players.map(eff)),sk:Object.fromEntries(AREAS.map(([k])=>[k,sdOf(players.map(p=>p[k]))]))};}
function dev2(arr,scale){const m=arr.reduce((a,b)=>a+b,0)/arr.length;let s=0;for(const x of arr){const d=(x-m)/scale;s+=d*d;}return s/arr.length;}
const BW={power:12,top:5,bot:6,stat:{sht:1.2,dri:1,pas:1.2,def:1.4,sta:1.6},spec:.5,pos:1.5,tier:.8,tall:.6,left:.5,overlap:.08};
function coreDev(st){const k=st.length,ns=Math.max(1,st.reduce((a,s)=>a+(s.n-s.guest),0)/k),sd=CTX.sd;
  return {power:dev2(st.map(s=>s.avg),sd/Math.sqrt(ns)),top:dev2(st.map(s=>s.top2),sd),bot:dev2(st.map(s=>s.bot2),sd),ns};}
function cost(teams){
  const st=teams.map(stats),k=teams.length,cd=coreDev(st);
  let c=BW.power*cd.power+BW.top*cd.top+BW.bot*cd.bot;
  for(const [a] of AREAS)c+=BW.stat[a]*dev2(st.map(s=>s[a]),CTX.sk[a]/Math.sqrt(cd.ns));
  c+=BW.pos*(dev2(st.map(s=>s.P.FW),1)+dev2(st.map(s=>s.P.DF),1));
  for(const t of ["S","A","B","C","D"])c+=BW.tier*(t==="S"||t==="A"?1.5:1)*dev2(st.map(s=>s.T[t]),1);
  for(const [a] of AREAS)c+=BW.spec*dev2(st.map(s=>s.spec[a]),1);
  c+=BW.tall*dev2(st.map(s=>s.tall),1)+BW.left*dev2(st.map(s=>s.left),1);
  const df=st.reduce((a,s)=>a+s.P.DF,0);if(df>=k)c+=500*st.filter(s=>s.P.DF===0).length;
  return c+pairCost(teams)+overlap(teams)*BW.overlap;
}
function balanceScore(teams){const cd=coreDev(teams.map(stats));return Math.max(0,Math.min(100,Math.round(100*Math.exp(-(cd.power+.4*cd.top+.4*cd.bot)/1.2))));}
const winProb=(a,b)=>1/(1+Math.pow(10,-(a-b)/1));
function snakeStart(players,caps,jitter){
  const arr=players.map(p=>({p,v:eff(p)+(Math.random()-.5)*jitter})).sort((a,b)=>b.v-a.v),k=caps.length,slots=[];
  for(let r=0;r<Math.max(...caps);r++){const order=[...Array(k).keys()];if(r%2)order.reverse();for(const t of order)if(r<caps[t])slots.push(t);}
  const teams=caps.map(()=>[]);arr.forEach((x,i)=>teams[slots[i]].push(x.p));return teams;
}
function randomStart(players,caps){
  const arr=[...players];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  const teams=caps.map(()=>[]);let i=0;caps.forEach((c,t)=>{for(let x=0;x<c;x++)teams[t].push(arr[i++]);});return teams;
}
function improve(teams,deadline){
  const k=teams.length;let cur=cost(teams);
  for(let guard=0;guard<400;guard++){
    if(performance.now()>deadline)break;
    let best=null;
    for(let a=0;a<k;a++)for(let b=a+1;b<k;b++)for(let i=0;i<teams[a].length;i++)for(let j=0;j<teams[b].length;j++){
      const x=teams[a][i],y=teams[b][j];teams[a][i]=y;teams[b][j]=x;const c=cost(teams);teams[a][i]=x;teams[b][j]=y;
      if(c<cur-1e-9&&(!best||c<best.c))best={a,b,i,j,c};
    }
    if(best){const t=teams[best.a][best.i];teams[best.a][best.i]=teams[best.b][best.j];teams[best.b][best.j]=t;cur=best.c;continue;}
    let found=false; // 2:2 교환
    outer:for(let a=0;a<k;a++)for(let b=a+1;b<k;b++){const A=teams[a],B=teams[b];
      for(let i1=0;i1<A.length;i1++)for(let i2=i1+1;i2<A.length;i2++)for(let j1=0;j1<B.length;j1++)for(let j2=j1+1;j2<B.length;j2++){
        const x1=A[i1],x2=A[i2],y1=B[j1],y2=B[j2];A[i1]=y1;A[i2]=y2;B[j1]=x1;B[j2]=x2;const c=cost(teams);
        if(c<cur-1e-9){cur=c;found=true;break outer;}
        A[i1]=x1;A[i2]=x2;B[j1]=y1;B[j2]=y2;}}
    if(!found)break;
  }
  return cur;
}
function coPairs(teams){const s=new Set();for(const t of teams){const ids=t.map(m=>m.id);for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)s.add(pk(ids[i],ids[j]));}return s;}
function searchTeams(players,caps,budgetMs){
  setCtx(players);
  const t0=performance.now(),deadline=t0+(budgetMs||900),res=[],randGaps=[];
  for(let run=0;run<60;run++){
    if(run>=3&&performance.now()>deadline)break;
    const teams=run===0?snakeStart(players,caps,0):run%2?randomStart(players,caps):snakeStart(players,caps,1.2);
    if(run%2){const a=teams.map(stats).map(x=>x.avg);randGaps.push(Math.max(...a)-Math.min(...a));}
    const c=improve(teams,deadline+400);
    teams.forEach(t=>t.sort((x,y)=>eff(y)-eff(x)));
    res.push({teams,cost:c});
  }
  res.sort((a,b)=>a.cost-b.cost);
  // 서로 충분히 다른 조합 3개 고르기 (같은 팀 짝이 일정 수 이상 달라야 함)
  const picked=[];
  for(const r of res){const sp=coPairs(r.teams);
    if(picked.every(p=>{let d=0;for(const x of sp)if(!p.sp.has(x))d++;return d>=Math.max(4,Math.round(sp.size*.15));}))picked.push({...r,sp});
    if(picked.length===3)break;}
  // 무작위 기준이 부족하면 추가로 몇 번 더 섞어서 비교 기준을 만든다 (계산만, 개선 없음)
  for(let i=randGaps.length;i<20;i++){const a=randomStart(players,caps).map(stats).map(x=>x.avg);randGaps.push(Math.max(...a)-Math.min(...a));}
  const baseGap=randGaps.reduce((a,b)=>a+b,0)/randGaps.length;
  return picked.map((p,rank)=>({teams:p.teams,cost:p.cost,score:balanceScore(p.teams),tried:res.length,baseGap,rank}));
}
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function dieHtml(cls){return `<div class="die ${cls}">${Array.from({length:9},()=>"<i></i>").join("")}</div>`;}
function setFace(el,n){el.querySelectorAll("i").forEach((d,i)=>d.classList.toggle("on",PIPS[n].includes(i)));}

}
function generateNow(){
  radarHidden=new Set();
  buildPairW();
  const rated=guests.filter(g=>g.rated).map(gNorm),unrated=guests.filter(g=>!g.rated);
  const players=[...attend].map(byId).filter(Boolean).concat(rated);
  const n=players.length+unrated.length,ch=kChoices(n);
  const k=teamCount&&ch.includes(teamCount)?teamCount:defaultK(n);
  const S=sizes(n,k);
  // 용병: 팀마다 고르게, 어느 팀에 갈지는 무작위(복불복)
  const g=Array(k).fill(0),order=[...Array(k).keys()].sort(()=>Math.random()-.5);
  for(let i=0;i<unrated.length;i++)g[order[i%k]]++;
  const caps=S.map((s,i)=>s-g[i]);
  const shuffledGuests=[...unrated].sort(()=>Math.random()-.5);
  options=searchTeams(players,caps,900);
  options.forEach(o=>{let gi=0;o.teams.forEach((t,ti)=>{for(let j=0;j<g[ti];j++)t.push({...shuffledGuests[gi++],guest:true});});});
  optIdx=0;selected=null;renderMake();
}

function parseLine(line){
  const tk=line.trim().split(/[\s,\t]+/).filter(Boolean);if(!tk.length)return null;
  const o={name:"",score:3,adj:0,active:true},nm=[],nums=[];
  for(const t of tk){const u=t.toUpperCase();
    if(/^[1-5](\.[05])?$/.test(t)){nums.push(+t);continue;}
    if(["FW","공격","공"].includes(u)){o.pos="FW";continue;}
    if(["DF","수비","수"].includes(u)){o.pos="DF";continue;}
    if(["ALL","올","올라운드"].includes(u)){o.pos="ALL";continue;}
    if(["GK","키퍼","골키퍼"].includes(u))continue;
    if(["장신","키"].includes(u)){o.tall=true;continue;}
    if(["왼발","L"].includes(u)){o.foot="L";continue;}
    nm.push(t);}
  o.name=nm.join(" ");if(!o.name)return null;
  if(nums.length>=2){AREAS.forEach(([k],i)=>o[k]=nums[i]??3);}else{AREAS.forEach(([k])=>o[k]=nums[0]||3);}
  if(o.pos==="FW"||o.pos==="DF")o.posSet=true;else{delete o.pos;}
  const n=norm(o);o.pos=n.pos;o.score=n.score;return o;
}

async function applyMatch(mt,undo){
  try{
    if(!undo){
      const d={};
      for(const g of mt.games){if(g.ga===g.gb)continue;const mult=Math.abs(g.ga-g.gb)>=3?1.5:1;const w=g.ga>g.gb?g.a:g.b,l=g.ga>g.gb?g.b:g.a;
        mt.teams[w].ids.forEach(id=>d[id]=(d[id]||0)+STEP*mult);mt.teams[l].ids.forEach(id=>d[id]=(d[id]||0)-STEP*mult);}
      const applied={};
      for(const [id,delta] of Object.entries(d)){const m=byId(id);if(!m)continue;const old=m.adj||0,nv=r2(Math.max(-ADJ_CAP,Math.min(ADJ_CAP,old+delta)));
        applied[id]=r2(nv-old);if(applied[id])await db.doc("members/"+id).update({adj:nv});}
      await db.doc("matches/"+mt.id).update({applied:true,deltas:applied});toast("점수에 반영했습니다");
    }else{
      for(const [id,delta] of Object.entries(mt.deltas||{})){const m=byId(id);if(!m||!delta)continue;await db.doc("members/"+id).update({adj:r2((m.adj||0)-delta)});}
      await db.doc("matches/"+mt.id).update({applied:false,deltas:{}});toast("반영을 취소했습니다");
    }
  }catch(e){dbErr(e);}
}

function reasonHtml(o,st){

  // ① 필수 조건

  const ap=activePairs(),where=new Map();o.teams.forEach((t,i)=>t.forEach(m=>where.set(m.id,i)));
  const pairOk=ap.filter(p=>where.get(p.a)===where.get(p.b)).length;
  const sizes=st.map(s=>s.n),sizeOk=rng(sizes)<=1;
  const ck=(ok,text)=>`<li style="display:flex;gap:6px"><span style="color:var(--${ok===null?"muted":ok?"good":"bad"})">${ok===null?"–":ok?"✓":"✕"}</span><span>${text}</span></li>`;
  const must=[ck(sizeOk,`팀 인원 ${sizes.join(" · ")}명 (차이 1명 이내)`),
    df>=k?ck(noDF===0,`팀마다 수비수 1명 이상 (수비수 ${df}명)`):ck(null,`수비수가 ${df}명뿐이라 ${k-df}팀은 수비수 없이 편성 (포지션을 확인해 주세요)`),
    ap.length?ck(pairOk===ap.length,`같은 팀 묶기 ${ap.length}짝 중 ${pairOk}짝 지킴`):ck(null,"같은 팀 묶기 없음")].join("");
  // ② 지표별 비교 표
  const rows=[
    ["팀 전력 평균",st.map(s=>s.avg),2,.1,.2],

    ["왼발",st.map(s=>s.left),0,1,2]];
  const th=`<tr style="color:var(--muted)"><td></td>${st.map((_,i)=>`<td style="padding:4px 6px;text-align:right">${i+1}팀</td>`).join("")}<td style="padding:4px 0 4px 8px;text-align:right">차이</td></tr>`;
  const tr=rows.map(([l,a,d,g,w])=>{const r=rng(a);return `<tr style="border-top:1px solid var(--line)"><td style="padding:5px 6px 5px 0;white-space:nowrap">${l}</td>${a.map(x=>`<td style="padding:5px 6px;text-align:right">${x.toFixed(d)}</td>`).join("")}<td style="padding:5px 0 5px 8px;text-align:right;white-space:nowrap">${mark(r,g,w)} ${r.toFixed(d)}</td></tr>`;}).join("");
  // ③ 얼마나 좋아졌나
  const gap=rng(st.map(s=>s.avg)),base=o.baseGap||0,times=gap>0?base/gap:0;
  const lo=lastOverlap(o.teams);
  const sum=o.tried?`후보 조합 <b>${o.tried}개</b>를 만들어 비교한 결과 중 <b>${(o.rank||0)+1}순위</b>예요. 아무렇게나 나누면 팀 전력 차가 평균 <b class="num">${base.toFixed(2)}</b>인데, 이 조합은 <b class="num">${gap.toFixed(2)}</b>${times>=1.5?` (<b>${times>=10?"10배 이상":times.toFixed(1)+"배"}</b> 더 고름)`:""}이에요.`:"";
  return `<details class="panel" open><summary style="cursor:pointer;font-weight:700">이 조합을 추천하는 근거</summary>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px;font-size:.86rem">
      ${sum?`<p style="margin:0">${sum}</p>`:""}
      <div><div class="label" style="margin-bottom:4px">반드시 지키는 조건</div><ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px">${must}</ul></div>
      <div><div class="label" style="margin-bottom:4px">팀별 비교 <span style="font-weight:400">(● 초록 고름 · 노랑 괜찮음 · 빨강 차이 큼)</span></div>

      <p class="small muted" style="margin:0">맞추는 순서: 팀 전력 → 에이스·약점 쏠림 → 능력치 5가지 → 주특기 선수 분산 → 공격·수비 인원 → 티어 분포 → 장신·왼발 분산${lo!==null?` · 지난 경기와 겹친 짝 ${lo}쌍`:""}</p>

const BIB_COL=["var(--bib1)","var(--bib2)","var(--bib3)","var(--bib4)","var(--bib5)","var(--bib6)"];
let radarHidden=new Set();
function radarHtml(st){
  // 축: 슈터·드리블러·패스마스터·수비력·활동량·종합 (육각형)
  const axes=[...AREAS.map(([k,l])=>[l,s=>s[k]]),["종합",s=>s.avg]];
  const vals=st.map(s=>axes.map(([,f])=>f(s)));
  const sk=vals.flat();
  // 팀 간 차이가 작아 0~5 전체로 그리면 겹쳐 보이므로, 실제 범위 주변만 확대 (눈금에 표시)
  let lo=Math.max(1,Math.floor(Math.min(...sk)*2)/2-.5),hi=Math.min(5,Math.ceil(Math.max(...sk)*2)/2+.5);if(hi-lo<1)hi=lo+1;
  const W=320,C=W/2,R=112,n=axes.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,f)=>[C+Math.cos(ang(i))*R*f,C+Math.sin(ang(i))*R*f];
  const frac=(i,v)=>Math.max(.05,(v-lo)/(hi-lo));
  const rings=[.25,.5,.75,1].map(f=>`<polygon points="${axes.map((_,i)=>pt(i,f).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join("");
  const spokes=axes.map((_,i)=>{const [x,y]=pt(i,1);return `<line x1="${C}" y1="${C}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;}).join("");
  const labels=axes.map(([l],i)=>{const [x,y]=pt(i,1.2);return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="var(--ink)">${l}</text>`;}).join("");
  const ticks=`<text x="${C+4}" y="${C-R-4}" font-size="10" fill="var(--muted)">${hi.toFixed(1)}</text><text x="${C+4}" y="${C-R*.5-2}" font-size="10" fill="var(--muted)">${((lo+hi)/2).toFixed(1)}</text>`;
  const polys=vals.map((v,ti)=>{if(radarHidden.has(ti))return "";const pts=v.map((x,i)=>pt(i,frac(i,x)).join(",")).join(" ");
    return `<polygon points="${pts}" fill="${BIB_COL[ti%6]}" fill-opacity=".12" stroke="${BIB_COL[ti%6]}" stroke-width="2.5" stroke-linejoin="round"/>`+
      v.map((x,i)=>{const [px,py]=pt(i,frac(i,x));return `<circle cx="${px}" cy="${py}" r="3.2" fill="${BIB_COL[ti%6]}"/>`;}).join("");}).join("");
  const lg=st.map((s,ti)=>`<button type="button" data-radar="${ti}" aria-pressed="${!radarHidden.has(ti)}"><i style="background:${BIB_COL[ti%6]}"></i>${BIBS[ti%6][0]} <span class="num muted">${s.avg.toFixed(2)}</span></button>`).join("");
  return `<div class="panel radar"><div class="row spread"><b>팀 능력치 비교</b><span class="small muted">눈금 ${lo.toFixed(1)}~${hi.toFixed(1)}점 확대</span></div>
    <svg viewBox="-30 -24 380 368" role="img" aria-label="팀별 슈터·드리블러·패스마스터·수비력·활동량·종합 레이더 차트">${rings}${spokes}${ticks}${polys}${labels}</svg>
    <div class="lg">${lg}</div><span class="small muted" style="text-align:center">팀 이름을 누르면 숨기거나 다시 보여요.</span></div>`;
}

function logLine(l){

    return `${who}님이 ${nm} 수정: ${parts.join(", ")}${tier}`;}

  if(l.kind==="reset")return `${who}님이 보정치 전체 초기화 (${l.count||0}명)`;

}

  const lim=await sample.limits().catch(()=>null);
  if(!lim||!lim.images){toast("이 화면에서는 이미지 인식을 쓸 수 없어요. 이름 붙여넣기를 이용해 주세요.");return null;}
  const per=Math.max(1,lim.images.maxCount||1),all=[...files],names=[];
  toast("캡처에서 이름을 읽는 중…");
  for(let i=0;i<all.length;i+=per){
    const chunk=all.slice(i,i+per);
    const prompt=`이 이미지들은 카카오톡 투표의 투표자 목록(또는 참석자 목록) 캡처입니다. 화면에 보이는 사람 이름을 위에서 아래 순서로 모두 뽑아 주세요.
- 화면에 쓰인 표시 이름 그대로 "raw"에 적고, 실제 사람 이름만 "name"에 적으세요. 예: "강정익_하이킥"→"강정익", "김태현형님"→"김태현", "물산 이기은형님_하이킥"→"이기은", "양도윤 프로"→"양도윤", 프로필 옆 "나" 표시는 빼세요.
- 투표 항목 제목, 상태바, 버튼 글자 등 사람 이름이 아닌 것은 넣지 마세요.
- 여러 장에 같은 사람이 겹쳐 보이면 한 번만 넣으세요.
JSON으로만 답하세요: {"people":[{"raw":"...","name":"..."}]}`;
    try{const r=await sample.json(prompt,{images:chunk,modelTier:"default"});(r&&r.people||[]).forEach(x=>names.push(x));}
    catch(e){if(e&&e.code==="not_granted"){toast("이미지 인식 권한이 허용되지 않았어요");return null;}toast("이미지를 읽지 못했어요. 다시 시도하거나 이름 붙여넣기를 이용해 주세요.");return null;}
  }
  return names;
}
function openImportReview(people){
  const seen=new Set(),rows=[];
  for(const p of people){const name=cleanName(p.name||p.raw||"");if(!name||seen.has(name))continue;seen.add(name);
    const m=matchMember(name,p.raw||name);rows.push({name,raw:p.raw||name,mid:m?m.id:null,act:m?"attend":"new"});}
  const draw=()=>{
    const hit=rows.filter(r=>r.mid),miss=rows.filter(r=>!r.mid);
    const hitIds=new Set(hit.map(r=>r.mid));
    const absent=members.filter(m=>m.active!==false&&!hitIds.has(m.id));
    $("#sheetRoot").innerHTML=`<div class="scrim" id="scrim"><div class="sheet">
    <div class="row spread"><h2>출석 불러오기</h2><button class="btn ghost small" id="cx">닫기</button></div>
    <div class="field"><span class="label">참석 · 회원 ${hit.length}명</span>
      ${hit.length?`<div class="chips">${hit.map(r=>{const m=byId(r.mid);return `<div class="chip" aria-pressed="true">${tierHtml(m.score)}<span class="nm">${esc(m.name)}</span></div>`;}).join("")}</div>`:`<span class="small muted">명단과 일치하는 회원이 없어요.</span>`}</div>
    ${miss.length?`<div class="field"><span class="label">명단에 없는 이름 ${miss.length}명</span>
      ${miss.map((r,i)=>`<div class="row spread" style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc(r.name)}</b><div class="seg">${[["new","신규 회원"],["guest","용병"],["skip","제외"]].map(([k,l])=>`<button type="button" data-imp="${rows.indexOf(r)}:${k}" aria-pressed="${r.act===k}">${l}</button>`).join("")}</div></div>`).join("")}
      <span class="small muted">신규 회원은 공·미·수 3점으로 등록돼요. 경기 전에 점수를 고쳐 주세요.</span></div>`:""}
    <div class="field"><span class="label">불참 처리 ${absent.length}명</span><span class="small muted">${absent.length?absent.map(m=>esc(m.name)).join(", "):"없음"}</span></div>
    <div class="notice">적용하면 오늘 출석 체크가 이 목록으로 바뀝니다.${guests.length?" 이미 추가한 용병은 그대로 둡니다.":""}</div>
    <button class="btn primary big" id="impApply">적용 (참석 ${hit.length+miss.filter(r=>r.act!=="skip").length}명)</button>
    </div></div>`;
    $("#scrim").onclick=e=>{if(e.target.id==="scrim")closeSheet();};$("#cx").onclick=closeSheet;
    document.querySelectorAll("[data-imp]").forEach(b=>b.onclick=()=>{const [i,k]=b.dataset.imp.split(":");rows[+i].act=k;draw();});
    $("#impApply").onclick=async()=>{
      $("#impApply").disabled=true;
      try{
        const ids=new Set(rows.filter(r=>r.mid).map(r=>r.mid));
        for(const r of rows.filter(r=>!r.mid&&r.act==="new")){
          const ref=db.collection("members").doc();
          await ref.set({name:r.name.slice(0,20),sht:3,dri:3,pas:3,def:3,sta:3,score:3,pos:"FW",adj:0,active:true});ids.add(ref.id);
        }
        rows.filter(r=>!r.mid&&r.act==="guest").forEach(r=>{if(!guests.some(g=>g.name===r.name))guests.push({id:"g"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:r.name.slice(0,20)});});
        // 비활성(휴면) 회원이 투표했으면 다시 활동으로
        for(const id of ids){const m=byId(id);if(m&&m.active===false)await db.doc("members/"+id).update({active:true});}
        attend=ids;options=[];closeSheet();renderMake();saveAttend();
        toast(`출석 ${ids.size+guests.length}명으로 정리했어요`);
      }catch(e){dbErr(e);$("#impApply").disabled=false;}
    };
  };
  if(!rows.length){toast("이름을 찾지 못했어요");return;}
  draw();
}
function openPasteNames(){
  $("#sheetRoot").innerHTML=`<div class="scrim" id="scrim"><form class="sheet" id="pasteForm">
    <div class="row spread"><h2>이름 붙여넣기</h2><button type="button" class="btn ghost small" id="cx">닫기</button></div>
    <p class="small muted" style="margin:0">참석자 이름을 한 줄에 한 명씩, 또는 쉼표로 구분해 붙여 넣으세요. "_하이킥", "형님", "프로" 같은 꼬리표는 알아서 뗍니다.</p>

/* ---------- PNG 공유 이미지 ---------- */
const BIB_HEX=["#F2762E","#E3BC14","#2F7FE0","#E04F8E","#6FB33A","#8A5CD6"];
async function makePng(dateStr,teams){
  try{await document.fonts.ready;}catch(e){}
  const W=1080,P=56,G=28,cols=teams.length<=2?teams.length:2,cw=(W-P*2-G*(cols-1))/cols;
  const rowH=58,headH=96,rows=Math.ceil(teams.length/cols);
  const maxN=Math.max(...teams.map(t=>t.length));
  const cardH=headH+maxN*rowH+24,top=250;
  const H=top+rows*cardH+(rows-1)*G+110;
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const DISP='"Black Han Sans","IBM Plex Sans KR",sans-serif',BODY='"IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif';
  x.fillStyle="#1D5A37";x.fillRect(0,0,W,H);
  x.strokeStyle="rgba(255,255,255,.12)";x.lineWidth=4;x.beginPath();x.arc(W,190,150,0,Math.PI*2);x.stroke();
  x.fillStyle="#F3F7F1";x.font="64px "+DISP;x.textBaseline="alphabetic";x.fillText("하이킥",P,130);
  x.font="500 34px "+BODY;x.fillStyle="rgba(243,247,241,.82)";x.fillText(fmtDate(dateStr)+" 팀 편성",P,186);
  const total=teams.reduce((a,t)=>a+t.length,0);
  x.textAlign="right";x.fillText(`${teams.length}팀 · ${total}명`,W-P,186);x.textAlign="left";
  const rr=(X,Y,w,h,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();};
  teams.forEach((t,i)=>{
    const cx=P+(i%cols)*(cw+G),cy=top+Math.floor(i/cols)*(cardH+G);
    x.fillStyle="#FFFFFF";rr(cx,cy,cw,cardH,22);x.fill();
    x.save();rr(cx,cy,cw,cardH,22);x.clip();x.fillStyle=BIB_HEX[i%6];x.fillRect(cx,cy,cw,headH-14);x.restore();
    x.fillStyle="#FFFFFF";x.font="44px "+DISP;x.fillText(BIBS[i%6][0],cx+30,cy+60);
    x.font="500 28px "+BODY;x.textAlign="right";x.fillText(t.length+"명",cx+cw-30,cy+58);x.textAlign="left";
    t.forEach((m,j)=>{
      const y=cy+headH+20+j*rowH;
      x.fillStyle=m.guest?"#8A968F":"#14211A";x.font=(m.guest?"400 ":"700 ")+"34px "+BODY;
      x.fillText(m.name,cx+30,y+12);
      let tag=m.guest?"용병":"";
      if(tag){x.font="500 24px "+BODY;x.fillStyle="#8A968F";x.textAlign="right";x.fillText(tag,cx+cw-30,y+10);x.textAlign="left";}
      if(j<t.length-1){x.fillStyle="#E6ECE7";x.fillRect(cx+30,y+30,cw-60,2);}
    });
  });
  x.font="400 24px "+BODY;x.fillStyle="rgba(243,247,241,.6)";x.fillText("하이킥 팀 밸런서",P,H-48);
  return await new Promise(res=>c.toBlob(res,"image/png"));
}
async function sharePng(dateStr,teams){
  const blob=await makePng(dateStr,teams);if(!blob){toast("이미지를 만들지 못했습니다");return;}
  const fname=`하이킥_팀편성_${dateStr}.png`;
  let dl=null;try{dl=await claude.use("downloads");}catch(e){}
  if(dl){try{await dl.save({filename:fname,data:blob});toast("이미지를 저장했습니다");return;}
    catch(e){if(e&&e.code==="declined")return;}}
  const url=URL.createObjectURL(blob);
  $("#sheetRoot").innerHTML=`<div class="scrim" id="scrim"><div class="sheet"><div class="row spread"><h2>팀 편성 이미지</h2><button class="btn ghost small" id="cx">닫기</button></div><p class="small muted" style="margin:0">이미지를 길게 눌러 저장하거나 공유하세요.</p><img src="${url}" alt="팀 편성 이미지" style="width:100%;border-radius:12px"></div></div>`;
  $("#scrim").onclick=e=>{if(e.target.id==="scrim"){closeSheet();URL.revokeObjectURL(url);}};$("#cx").onclick=()=>{closeSheet();URL.revokeObjectURL(url);};
}

(async()=>{
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null;}catch(e){db=null;}
  if(!db){ready=true;renderAll();return;}
  let got={m:false,x:false,a:false};
  const done=k=>{got[k]=true;if(got.m&&got.x&&got.a&&!ready){ready=true;}renderAll();};
  db.collection("members").onSnapshot(s=>{members=s.docs.map(d=>norm({id:d.id,...d.data()}));
    for(const id of [...attend])if(!byId(id))attend.delete(id);
    if(options.length){options.forEach(o=>o.teams=o.teams.map(t=>t.map(m=>byId(m.id)||m)));}
    done("m");},e=>{});
  db.collection("matches").onSnapshot(s=>{matches=s.docs.map(d=>({id:d.id,...d.data()}));done("x");},e=>{});
  db.collection("logs").orderBy("at","desc").limit(200).onSnapshot(s=>{logs=s.docs.map(d=>({id:d.id,...d.data()}));if(document.getElementById("logList"))renderLogList();},e=>{});
  db.doc("public/next").onSnapshot(s=>{pubNext=s.exists?s.data():null;},e=>{});
  db.doc("state/pairs").onSnapshot(s=>{pairs=s.exists?(s.data().list||[]):[];renderMake();},e=>{});
  db.doc("state/attendance").onSnapshot(s=>{const d=s.exists?s.data():null;
    if(d&&!attendTimer&&d.matchDate)matchDate=d.matchDate;
    if(d){const nw=new Set(d.ids||[]);const same=nw.size===attend.size&&[...nw].every(x=>attend.has(x));if(!attendTimer){const ng=d.guests||[];const gsame=ng.length===guests.length&&ng.every((g,i)=>g.id===guests[i].id);
      if(!same||!gsame){attend=nw;guests=ng.map(g=>({...g}));options=[];}}}
    else if(!s.metadata.hasPendingWrites&&!attendTimer){attend=new Set();guests=[];}
    done("a");},e=>{});
})();
})();
